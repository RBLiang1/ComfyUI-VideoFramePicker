<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="节点界面示意">
  <defs>
    <linearGradient id="frameBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3440"/>
      <stop offset="100%" stop-color="#1a2028"/>
    </linearGradient>
    <style>
      .lbl { font: 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #e6e9ee; }
      .dim { font: 11px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #9aa5b1; }
      .btn { fill: #3a4250; stroke: #525c6b; stroke-width: 1; }
      .btnt { font: 700 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #e6e9ee; text-anchor: middle; }
      .box { fill: #2a313b; stroke: #4a5462; stroke-width: 1; }
      .note { font: 11px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #8f9aa6; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="470" fill="#1b1f24"/>
  <rect x="20" y="16" width="470" height="430" rx="9" fill="#252b33" stroke="#3c4552"/>

  <!-- title bar -->
  <path d="M20 25 a9 9 0 0 1 9 -9 h452 a9 9 0 0 1 9 9 v21 h-470 z" fill="#323b46"/>
  <text x="34" y="36" class="lbl" font-weight="600">视频抽帧（路径 · 预览选帧）</text>
  <circle cx="474" cy="31" r="5" fill="#5aa9ff" opacity=".85"/>

  <!-- pick file button (drawn folder icon, no emoji) -->
  <rect x="34" y="60" width="106" height="24" rx="5" class="box"/>
  <g transform="translate(44,68)">
    <path d="M0 1.4 a1.4 1.4 0 0 1 1.4 -1.4 h3.4 l1.8 2 h5 a1.4 1.4 0 0 1 1.4 1.4 v6.8 a1.4 1.4 0 0 1 -1.4 1.4 h-10.2 a1.4 1.4 0 0 1 -1.4 -1.4 z"
          fill="#c8d0da" opacity=".9"/>
  </g>
  <text x="62" y="76" class="lbl">选择视频…</text>
  <text x="152" y="76" class="dim">\\NAS\shoot\shot_012.mp4</text>

  <!-- video area -->
  <rect x="34" y="94" width="442" height="212" rx="6" fill="url(#frameBg)" stroke="#3c4552"/>
  <g opacity=".45">
    <rect x="196" y="162" width="118" height="66" rx="5" fill="none" stroke="#7d8794" stroke-width="2"/>
    <path d="M196 162 l20 20 M216 162 l20 20 M236 162 l20 20 M256 162 l20 20 M276 162 l20 20 M296 162 l20 20" stroke="#7d8794" stroke-width="1.5" opacity=".7"/>
    <path d="M243 180 l22 15 -22 15 z" fill="#aab4c0"/>
  </g>
  <text x="255" y="272" class="dim" text-anchor="middle">视频画面（点一下 = 播放 / 暂停）</text>

  <!-- transport row -->
  <rect x="34" y="316" width="30" height="24" rx="5" class="btn"/><text x="49" y="332" class="btnt">|◀</text>
  <rect x="68" y="316" width="34" height="24" rx="5" class="btn"/><text x="85" y="332" class="btnt">◀◀</text>
  <rect x="106" y="316" width="34" height="24" rx="5" class="btn"/><text x="123" y="332" class="btnt">▶</text>
  <rect x="144" y="316" width="34" height="24" rx="5" class="btn"/><text x="161" y="332" class="btnt">▶▶</text>
  <rect x="182" y="316" width="32" height="24" rx="5" class="btn"/><text x="198" y="332" class="btnt">▶|</text>
  <text x="228" y="333" class="dim">步进</text>
  <rect x="258" y="316" width="46" height="24" rx="5" fill="#1f242b" stroke="#525c6b"/>
  <text x="281" y="332" class="lbl" text-anchor="middle">5</text>

  <!-- slider -->
  <line x1="34" y1="358" x2="476" y2="358" stroke="#4a5462" stroke-width="4" stroke-linecap="round"/>
  <line x1="34" y1="358" x2="118" y2="358" stroke="#5aa9ff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="118" cy="358" r="7" fill="#5aa9ff"/>

  <text x="34" y="384" class="dim">帧 38 / 157 · 24.00fps · 1376x768 · 1.58s</text>

  <!-- widgets -->
  <text x="34" y="410" class="dim">path</text>
  <rect x="66" y="398" width="404" height="18" rx="3" class="box"/>
  <text x="74" y="411" class="dim" font-size="10">\\NAS\shoot\shot_012.mp4</text>
  <text x="34" y="436" class="dim">frame</text>
  <rect x="72" y="424" width="60" height="18" rx="3" class="box"/>
  <text x="80" y="437" class="dim" font-size="10">38</text>

  <!-- connectors -->
  <g stroke="#4f6f92" fill="#4f6f92" stroke-width="1">
    <path d="M490 72 H506" fill="none"/><circle cx="508" cy="72" r="2.5" stroke="none"/>
    <path d="M490 118 H506" fill="none"/><circle cx="508" cy="118" r="2.5" stroke="none"/>
    <path d="M490 328 H506" fill="none"/><circle cx="508" cy="328" r="2.5" stroke="none"/>
  </g>
  <g class="note">
    <text x="522" y="76">点选目录，支持 SMB / UNC</text>
    <text x="522" y="116">预览走 HTTP Range，</text>
    <text x="522" y="132">大文件只取片段</text>
    <text x="522" y="324">暂停即定格该帧，</text>
    <text x="522" y="340">帧号写回 frame</text>
  </g>

  <rect x="510" y="176" width="230" height="124" rx="7" fill="#232a32" stroke="#3c4552"/>
  <text x="524" y="198" class="lbl" font-weight="600">执行时</text>
  <text x="524" y="218" class="note">ffmpeg -ss 定位 → 只解 1 帧</text>
  <text x="524" y="238" class="note">不把整段视频读进内存</text>
  <text x="524" y="258" class="note">与顺序解码逐像素一致</text>
  <text x="524" y="282" class="note" fill="#7fd08a">几 GB 片源 ≈ 秒级</text>
</svg>
